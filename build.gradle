plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.3'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'edu.cornell.raven.core.audio.x3a'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Library API docs only: source/classpath pinned to the main source set so the
// tools (JavaFX test app) and jmh (benchmark) source sets never leak in, even if
// someone later adds a dependency between them.
javadoc {
    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
    title = "X3 Java Codec ${version} API"
    options {
        encoding = 'UTF-8'
        memberLevel = JavadocMemberLevel.PUBLIC
    }
}

// Phase 6: minimal JavaFX drag-and-drop verification app — test scaffolding, not
// library code. Its own source set keeps JavaFX out of main's dependencies and
// out of module-info.java (see development-plan.md Phase 6).
sourceSets {
    tools {
        java {
            srcDirs = ['src/tools/java']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls']
    configuration = 'toolsImplementation'
}

tasks.register('runTestApp', JavaExec) {
    group = 'application'
    description = 'Runs the Phase 6 JavaFX drag-and-drop verification app (tools source set).'
    mainClass = 'edu.cornell.raven.core.audio.x3a.tools.X3VerificationApp'
    // The javafx plugin only auto-wires --module-path/--add-modules onto the
    // application plugin's "run" task; this is a custom-named JavaExec task, so
    // split the javafx jars onto an explicit module path ourselves.
    doFirst {
        def toolsRuntime = sourceSets.tools.runtimeClasspath
        def javafxJars = toolsRuntime.filter { it.name.startsWith('javafx-') }
        classpath = toolsRuntime - javafxJars
        jvmArgs = ['--module-path', javafxJars.asPath, '--add-modules', 'javafx.controls']
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JMH core/annotation APIs are provided by the me.champeau.jmh plugin;
    // pin explicitly so IDE/source sets resolve cleanly.
    jmh 'org.openjdk.jmh:jmh-core:1.37'
    jmh 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

test {
    useJUnitPlatform()
}

jmh {
    jmhVersion = '1.37'
    warmupIterations = 1
    iterations = 1
    fork = 1
    // Leave benchmarkMode unset so per-class @BenchmarkMode wins (Throughput microbenches
    // vs SingleShotTime for ConversionBenchmark file I/O).
    timeUnit = 's'
    failOnError = true
    duplicateClassesStrategy = DuplicatesStrategy.EXCLUDE
    // Keep defaults low so `./gradlew jmh` is usable as a smoke run; override via -Pjmh.includes etc.
    includes = project.findProperty('jmh.includes') != null
            ? [project.property('jmh.includes') as String]
            : []
    profilers = []
    humanOutputFile = project.file("${project.layout.buildDirectory.get().asFile}/reports/jmh/human.txt")
    resultsFile = project.file("${project.layout.buildDirectory.get().asFile}/reports/jmh/results.json")
    resultFormat = 'JSON'
}

// Convenience task alias documented for local runs:
//   ./gradlew jmh
//   ./gradlew jmhJar
// Filter benchmarks:
//   ./gradlew jmh -Pjmh.includes=.*BitstreamReader.*
// Paper-suite conversion CSV (minimal single-shot JMH):
//   ./gradlew conversionBenchmark
tasks.named('jmh') {
    group = 'benchmark'
    description = 'Runs JMH microbenchmarks for the X3 decoder (src/jmh/java).'
}

tasks.register('benchmark') {
    group = 'benchmark'
    description = 'Alias for the jmh task.'
    dependsOn 'jmh'
}

tasks.register('conversionBenchmark', JavaExec) {
    group = 'benchmark'
    description = 'Paper-suite wav↔x3a JMH conversion benchmark with CSV summary (minimal warmup/iters).'
    dependsOn 'jmhCompileGeneratedClasses'
    // jmh source set + bytecode-generator output (META-INF/BenchmarkList + * _jmhType classes)
    classpath = sourceSets.jmh.runtimeClasspath + files(
            layout.buildDirectory.dir('jmh-generated-classes'),
            layout.buildDirectory.dir('jmh-generated-resources'))
    mainClass = 'edu.cornell.raven.core.audio.x3a.ConversionBenchmark'
    // Optional: -Pconv.w=1 -Pconv.i=1
    if (project.hasProperty('conv.w')) {
        args '-w', project.property('conv.w')
    }
    if (project.hasProperty('conv.i')) {
        args '-i', project.property('conv.i')
    }
}
